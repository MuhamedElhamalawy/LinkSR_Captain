<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>تطبيق الكابتن - SmartRide</title>
  <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet">
  <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root { --primary: #2563eb; --success: #16a34a; --danger: #dc2626; --warning: #d97706; --dark: #0f172a; }
    * { box-sizing: border-box; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; }
    body { background: var(--dark); color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    /* هيدر الكابتن المنظم والمرتب بدقة */
    .driver-header { background: #0f172a; padding: 10px 14px; border-bottom: 1px solid #334155; z-index: 20; }
    .top-profile-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; gap: 6px; }
    
    .rating-frame { padding: 3px 10px; border-radius: 10px; font-weight: 900; font-size: 0.82rem; display: inline-flex; align-items: center; gap: 4px; }
    .tier-gold { background: linear-gradient(135deg, #fef08a, #eab308); color: #422006; border: 2px solid #fff; box-shadow: 0 0 12px rgba(234, 179, 8, 0.7); }
    .tier-green { background: linear-gradient(135deg, #dcfce7, #22c55e); color: #052e16; border: 2px solid #15803d; }
    .tier-orange { background: linear-gradient(135deg, #ffedd5, #f97316); color: #431407; border: 2px solid #c2410c; } /* برتقالي مائل للحمرة بدلاً من الأصفر */
    .tier-red { background: linear-gradient(135deg, #fee2e2, #ef4444); color: #fff; border: 2px solid #991b1b; }

    .car-info-bar { background: #1e293b; padding: 6px 10px; border-radius: 8px; font-size: 0.78rem; display: flex; justify-content: space-between; align-items: center; border: 1px solid #334155; }
    .plate-badge { background: #facc15; color: #000; font-weight: 900; padding: 2px 8px; border-radius: 4px; }

    .switch-wrap { display: flex; align-items: center; gap: 6px; }
    .switch { position: relative; display: inline-block; width: 48px; height: 24px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; inset: 0; background-color: #ef4444; transition: .3s; border-radius: 34px; }
    .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
    input:checked + .slider { background-color: #22c55e; }
    input:checked + .slider:before { transform: translateX(24px); }

    /* شاشة الطلب الوارد */
    .incoming-panel {
      max-height: 30vh; background: linear-gradient(135deg, #1e1b4b, #31102f);
      border-bottom: 4px solid #f59e0b; padding: 8px 14px; display: none;
      flex-direction: column; justify-content: space-between; align-items: center;
      text-align: center; z-index: 30; animation: pulseBg 0.7s infinite alternate;
    }
    @keyframes pulseBg { from { background: #1e1b4b; } to { background: #450a0a; } }

    .incoming-top-flex { display: flex; justify-content: space-between; align-items: center; width: 100%; gap: 8px; }
    .distance-highlight-box { background: #facc15; color: #000; padding: 3px 10px; border-radius: 8px; font-size: 0.95rem; font-weight: 900; border: 2px solid #fff; white-space: nowrap; }
    .timer-circle { width: 40px; height: 40px; border-radius: 50%; background: var(--danger); color: #fff; font-size: 1.25rem; font-weight: 900; display: flex; align-items: center; justify-content: center; border: 2px solid #fecaca; flex-shrink: 0; }

    .btn { width: 100%; padding: 8px 10px; border: none; border-radius: 8px; font-weight: 800; cursor: pointer; font-size: 0.84rem; display: inline-flex; align-items: center; justify-content: center; gap: 4px; text-decoration: none; }
    .btn-success { background: var(--success); color: #fff; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-warning { background: var(--warning); color: #fff; }
    .btn-gmaps { background: #10b981; color: #fff; border: 1px solid #a7f3d0; }
    .btn-wa { background: #25D366; color: #fff; }

    .map-area { flex: 1; position: relative; width: 100%; }
    #driver-map { width: 100%; height: 100%; }
    .gps-status-pill { position: absolute; top: 10px; right: 10px; background: rgba(15,23,42,0.9); color: #38bdf8; padding: 4px 10px; border-radius: 20px; font-size: 0.7rem; font-weight: 700; z-index: 15; border: 1px solid #334155; pointer-events: none; }

    /* نبضات الرادار الحية الحاصلة من عناوين الطلبات وأماكن الكباتن */
    .radar-pulse-dot { position: relative; width: 65px; height: 65px; display: flex; align-items: center; justify-content: center; pointer-events: none; }
    .radar-pulse-dot .ring { position: absolute; width: 100%; height: 100%; border-radius: 50%; background: rgba(239, 68, 68, 0.4); border: 2px solid #ef4444; animation: expandRing 1.8s infinite ease-out; }
    .radar-pulse-dot .core { position: relative; z-index: 2; background: #dc2626; color: #fff; font-size: 0.65rem; font-weight: 900; padding: 2px 6px; border-radius: 8px; border: 1px solid #fde047; white-space: nowrap; }
    @keyframes expandRing { 0% { transform: scale(0.3); opacity: 1; } 100% { transform: scale(1.8); opacity: 0; } }

    .auth-overlay { position: fixed; inset: 0; background: #020617; z-index: 8000; display: flex; align-items: center; justify-content: center; padding: 15px; }
    .auth-box { background: #1e293b; border: 1px solid #334155; color: #fff; width: 100%; max-width: 380px; border-radius: 16px; padding: 20px; }
    input, textarea { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 0.9rem; margin-bottom: 8px; }

    .block-banner-box { background: #450a0a; border: 2px solid #ef4444; color: #fecaca; padding: 8px 12px; font-size: 0.8rem; font-weight: 800; display: none; z-index: 25; }
    .expiry-warning-bar { background: #78350f; border-bottom: 2px solid #f59e0b; color: #fef08a; padding: 5px 12px; font-size: 0.75rem; font-weight: 800; display: none; z-index: 24; }

    .rate-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 9000; display: none; align-items: center; justify-content: center; padding: 15px; }
    .rate-box { background: #1e293b; border: 2px solid #38bdf8; border-radius: 14px; padding: 18px; width: 100%; max-width: 380px; text-align: center; }
    .stars-row { display: flex; justify-content: center; gap: 8px; margin: 12px 0; direction: ltr; }
    .star-pick { font-size: 2.2rem; background: none; border: none; color: #475569; cursor: pointer; }
    .star-pick.active { color: #eab308; }

    .fullscreen-modal { position: fixed; inset: 0; width: 100vw; height: 100vh; background: #0f172a; z-index: 9500; display: none; flex-direction: column; }
    .fullscreen-modal.open { display: flex; }
    .msg-bubble { padding: 8px 12px; border-radius: 10px; margin-bottom: 8px; font-size: 0.84rem; max-width: 85%; }
    .msg-me { background: #1d4ed8; color: #fff; margin-left: auto; }
    .msg-admin { background: #334155; color: #f8fafc; margin-right: auto; }
  </style>
</head>
<body>

  <!-- شاشة الدخول -->
  <div class="auth-overlay" id="driver-auth-screen">
    <div class="auth-box">
      <h3 style="text-align:center; color:#38bdf8; margin-bottom:10px;">🛞 بوابة الكابتن</h3>
      <label style="font-size:0.78rem;">رقم الهاتف (المرجعي):</label>
      <input type="tel" id="drv-login-phone" placeholder="01xxxxxxxxx">
      <label style="font-size:0.78rem;">كلمة المرور:</label>
      <input type="password" id="drv-login-pass" placeholder="الباسورد">
      <button class="btn btn-primary" style="padding:10px;" onclick="handleDriverLogin()">🔓 دخول وتفعيل الشاشة</button>
    </div>
  </div>

  <!-- الهيدر المرتب بدقة -->
  <div class="driver-header">
    <div class="top-profile-row">
      <div style="display:flex; align-items:center; gap:8px;">
        <img id="hdr-drv-photo" src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" style="width:38px; height:38px; border-radius:50%; object-fit:cover; border:2px solid #38bdf8;">
        <div>
          <div id="hdr-drv-badge" class="rating-frame tier-green">
            <span id="ui-drv-name">كابتن</span>
            <span>⭐ <b id="ui-drv-rating">4.0</b></span>
          </div>
        </div>
      </div>

      <!-- أقصى اليسار المراسلات، وأقصى اليمين الحساب المالي وعدد الرحلات -->
      <div style="display:flex; align-items:center; gap:6px;">
        <button onclick="openDriverMessages()" style="background:#0284c7; color:#fff; border:none; padding:4px 8px; border-radius:6px; font-size:0.72rem; font-weight:800; cursor:pointer;">✉️ المراسلات</button>
        <div style="text-align:left; font-size:0.72rem;">
          <div>الحساب: <b id="ui-drv-bal" style="font-weight:900;">0 ج</b></div>
          <div>الرحلات: <b id="ui-drv-trips-count" style="color:#38bdf8;">0</b></div>
        </div>
        <div class="switch-wrap">
          <label class="switch">
            <input type="checkbox" id="chk-online" onchange="toggleOnlineState(this.checked)">
            <span class="slider"></span>
          </label>
        </div>
        <button onclick="logoutDriver()" style="background:var(--danger); color:#fff; border:none; padding:4px 6px; border-radius:6px; font-size:0.68rem; cursor:pointer;">خروج</button>
      </div>
    </div>

    <!-- نوع السيارة والماركة والسنة تحت الهيدر، والرقم أقصى اليسار -->
    <div class="car-info-bar">
      <div>
        <span id="ui-drv-cat">🚗 ملاكي</span> |
        <b id="ui-drv-model">نيسان صني 2024</b>
      </div>
      <div class="plate-badge" id="ui-drv-plate">ق ب أ 1234</div>
    </div>
  </div>

  <div class="block-banner-box" id="drv-block-banner"></div>
  <div class="expiry-warning-bar" id="drv-expiry-warning"></div>

  <!-- لوحة الطلب الوارد -->
  <div class="incoming-panel" id="incoming-box">
    <div class="incoming-top-flex">
      <div class="distance-highlight-box">
        📍 يبعد: <span id="inc-dist">0.00 كم</span>
      </div>
      <div class="timer-circle" id="inc-timer">6</div>
    </div>
    <div id="inc-details" style="font-size:0.78rem; font-weight:700; color:#fde047; margin:2px 0;"></div>
    <div style="display:flex; gap:8px; width:100%;">
      <button class="btn btn-success" onclick="acceptOffer()">✅ اقبل</button>
      <button class="btn btn-danger" onclick="rejectOfferExplicitly()">❌ ارفض</button>
    </div>
  </div>

  <!-- شريط الرحلة الجارية -->
  <div id="active-trip-bar" style="display:none; background:#1e293b; padding:10px 14px; border-bottom:2px solid #38bdf8; z-index:25;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
      <span id="trip-state-lbl" style="font-size:0.82rem; font-weight:800; color:#fde047;">متجه للعميل</span>
      <span style="font-size:1rem; font-weight:900; color:#4ade80;"><span id="live-fare-val">0</span> ج.م (<span id="live-km-val">0.00</span> كم)</span>
    </div>

    <div style="background:#0f172a; padding:6px 10px; border-radius:6px; border:1px solid #334155; margin-bottom:6px; display:flex; justify-content:space-between; align-items:center; font-size:0.78rem;">
      <span>👤 العميل: <b id="active-cli-name"></b> | 📱 <span id="active-cli-phone" dir="ltr"></span></span>
      <div style="display:flex; gap:4px;">
        <a id="btn-call-client" href="#" class="btn btn-primary" style="width:auto; padding:3px 8px; font-size:0.72rem;">📞 اتصال</a>
        <a id="btn-wa-client" href="#" target="_blank" class="btn btn-wa" style="width:auto; padding:3px 8px; font-size:0.72rem;">💬 واتساب</a>
      </div>
    </div>

    <div style="display:flex; gap:6px; flex-wrap:wrap;">
      <button class="btn btn-warning" id="btn-arrived" style="flex:1;" onclick="markArrived()">📍 وصلت</button>
      <button class="btn btn-primary" id="btn-start" style="flex:1; display:none;" onclick="startRide()">▶️ ابدأ الرحلة</button>
      <button class="btn btn-gmaps" id="btn-google-nav" style="flex:1;" onclick="openGoogleMapsNavigation()">🗺️ فتح خرائط جوجل</button>
      <button class="btn btn-danger" id="btn-cancel-accepted" style="flex:1;" onclick="cancelAcceptedRideWithReason()">🚫 إلغاء</button>
      <button class="btn btn-danger" id="btn-finish" style="flex:1; display:none;" onclick="finishRide()">🏁 إنهاء</button>
    </div>
  </div>

  <!-- نافذة تقييم العميل -->
  <div class="rate-modal" id="rate-client-modal">
    <div class="rate-box">
      <h3 style="color:#4ade80; margin-bottom:6px;">🏁 اكتملت الرحلة!</h3>
      <div id="drv-invoice-summary" style="font-size:0.85rem; margin-bottom:10px; line-height:1.5;"></div>
      <div style="font-size:0.82rem; font-weight:800;">⭐ قيّم العميل:</div>
      <div class="stars-row" id="drv-rate-stars">
        <button class="star-pick active" onclick="pickClientStars(1)">★</button>
        <button class="star-pick active" onclick="pickClientStars(2)">★</button>
        <button class="star-pick active" onclick="pickClientStars(3)">★</button>
        <button class="star-pick active" onclick="pickClientStars(4)">★</button>
        <button class="star-pick active" onclick="pickClientStars(5)">★</button>
      </div>
      <button class="btn btn-success" onclick="submitClientRating()">✅ حفظ التقييم</button>
    </div>
  </div>

  <!-- الخريطة (تعرض رادار الطلبات الحية وأماكن الكباتن الآخرين عند الانتظار ولا تظهر أثناء الرحلة) -->
  <div class="map-area">
    <div class="gps-status-pill" id="gps-live-badge">🛰️ رادار الطلبات نشط</div>
    <div id="driver-map"></div>
  </div>

  <!-- صندوق المراسلات -->
  <div class="fullscreen-modal" id="drv-messages-modal">
    <div style="background:#1e293b; padding:10px 14px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #334155;">
      <span style="font-weight:900;">✉️ مراسلات الكابتن</span>
      <button onclick="closeDriverMessages()" style="background:#dc2626; color:#fff; border:none; padding:3px 8px; border-radius:6px; cursor:pointer;">إغلاق ✖</button>
    </div>
    <div style="flex:1; overflow-y:auto; padding:12px; max-width:550px; width:100%; margin:0 auto;">
      <div id="drv-threads-list-view">
        <div style="background:#1e293b; padding:10px; border-radius:8px; margin-bottom:10px;">
          <input type="text" id="drv-msg-subj" placeholder="الموضوع">
          <textarea id="drv-msg-body" rows="2" placeholder="الرسالة..."></textarea>
          <button class="btn btn-primary" onclick="createDriverThread()">إرسال</button>
        </div>
        <div id="drv-threads-container"></div>
      </div>
      <div id="drv-thread-detail-view" style="display:none; flex-direction:column; height:80vh;">
        <button class="btn btn-warning" style="margin-bottom:8px; width:fit-content;" onclick="backToDriverThreads()">🔙 العودة</button>
        <div style="background:#1e293b; padding:10px; border-radius:8px; flex:1; display:flex; flex-direction:column; overflow:hidden;">
          <div style="border-bottom:1px solid #334155; padding-bottom:4px; margin-bottom:6px;"><b id="drv-view-subj"></b></div>
          <div id="drv-view-messages" style="flex:1; overflow-y:auto; display:flex; flex-direction:column; padding:4px;"></div>
          <div style="display:flex; gap:6px; margin-top:6px;">
            <input type="text" id="drv-reply-inp" placeholder="رد..." style="margin:0;">
            <button class="btn btn-primary" style="width:80px;" onclick="sendDriverReply()">إرسال</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, get, update, push, set, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB5GqPcEhvzHoe45SYYUNL7E9oqVdmVrag",
      authDomain: "projectlinkst.firebaseapp.com",
      databaseURL: "https://projectlinkst-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "projectlinkst",
      storageBucket: "projectlinkst.firebasestorage.app",
      messagingSenderId: "704490160583",
      appId: "1:704490160583:web:c4031a44ee6ec2fffa99e2"
    };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    mapboxgl.accessToken = "pk.eyJ1IjoibXVoYW1lZGVsaGFtYWxhd3kiLCJhIjoiY212dXZrcDJlMGF2YjM1czVqOGtkbWVldCJ9.yGoETr4LTcLOGbx1_UFc5Q";

    // منع انطفاء الشاشة نهائياً أثناء فتح تطبيق الكابتن
    async function activateWakeLock() {
      try { if ('wakeLock' in navigator) await navigator.wakeLock.request('screen'); } catch (e) {}
    }
    document.addEventListener('click', () => { activateWakeLock(); }, { once: true });
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') activateWakeLock(); });

    let currentDriverPhone = localStorage.getItem('smartride_driver_phone') || null;
    let settings = {}, driversDB = {}, clientsDB = {}, ridesDB = {}, messagesDB = {};
    let isOnline = false, myPos = { lat: 30.4682, lng: 31.1870 };
    let currentOfferId = null, activeRideId = null, lastCompletedRideForRating = null, openedDrvThreadId = null;
    let chosenStarsForClient = 5;
    let countdownInterval = null, alarmInterval = null, wait5Interval = null, meterInterval = null, gpsWatchId = null;
    let lastGPS = null, accKm = 0, accWait = 0;

    // دالة التقييم اللوني (ذهبي 4.7-5 / أخضر 4-4.7 / برتقالي مائل للحمرة 3-4 / أحمر <3)
    function getRatingInfo(entity) {
      if (!entity || !entity.ratingCount || entity.ratingCount === 0) {
        return { avg: 4.0, tierClass: 'tier-green', label: '4.0' };
      }
      const avg = +(entity.ratingSum / entity.ratingCount).toFixed(2);
      let tierClass = 'tier-green';
      if (avg >= 4.7) tierClass = 'tier-gold';
      else if (avg >= 4.0) tierClass = 'tier-green';
      else if (avg >= 3.0) tierClass = 'tier-orange'; // برتقالي مائل للحمرة بدل الأصفر
      else tierClass = 'tier-red';
      return { avg, tierClass, label: avg.toFixed(1) };
    }

    const map = new mapboxgl.Map({
      container: 'driver-map',
      style: 'mapbox://styles/mapbox/streets-v12',
      center: [myPos.lng, myPos.lat],
      zoom: 14
    });
    let mapMarkers = [];

    // تسجيل الأحداث في سجل الأحداث (Audit Log)
    async function logRideEvent(rideId, eventText) {
      if (!rideId) return;
      const evRef = push(ref(db, `smartride/rides/${rideId}/events_log`));
      await set(evRef, {
        text: eventText,
        timestamp: Date.now()
      });
    }

    window.handleDriverLogin = async function() {
      const phone = document.getElementById('drv-login-phone').value.trim();
      const pass = document.getElementById('drv-login-pass').value.trim();
      if (!phone || !pass) return alert("أدخل رقم الهاتف والباسورد!");

      const snap = await get(ref(db, `smartride/drivers/${phone}`));
      if (!snap.exists()) return alert("رقم الهاتف غير مسجل!");
      const drv = snap.val();
      if (drv.password !== pass) return alert("الباسورد خطأ!");

      currentDriverPhone = phone;
      localStorage.setItem('smartride_driver_phone', phone);
      document.getElementById('driver-auth-screen').style.display = 'none';
      refreshHeaderUI();
    };

    window.logoutDriver = async function() {
      if (currentDriverPhone) await update(ref(db, `smartride/drivers/${currentDriverPhone}`), { online: false });
      localStorage.removeItem('smartride_driver_phone');
      currentDriverPhone = null;
      document.getElementById('driver-auth-screen').style.display = 'flex';
    };

    onValue(ref(db, 'smartride/settings'), snap => { if (snap.exists()) settings = snap.val(); });
    onValue(ref(db, 'smartride/clients'), snap => { clientsDB = snap.val() || {}; });
    onValue(ref(db, 'smartride/drivers'), snap => {
      driversDB = snap.val() || {};
      if (currentDriverPhone && driversDB[currentDriverPhone]) {
        document.getElementById('driver-auth-screen').style.display = 'none';
        refreshHeaderUI();
      }
      renderDriverMapMarkers();
    });
    onValue(ref(db, 'smartride/rides'), snap => { ridesDB = snap.val() || {}; checkIncomingAndActiveRides(); renderDriverMapMarkers(); });
    onValue(ref(db, 'smartride/messages'), snap => { messagesDB = snap.val() || {}; });

    // رسم رادار الطلبات الحية وأماكن الكباتن على خريطة الكابتن (تختفي الخريطة أثناء الرحلة)
    function renderDriverMapMarkers() {
      mapMarkers.forEach(m => m.remove());
      mapMarkers = [];
      if (!currentDriverPhone) return;

      const mapAreaEl = document.querySelector('.map-area');
      if (activeRideId) {
        mapAreaEl.style.display = 'none'; // إخفاء الخريطة نهائياً أثناء الرحلة بناءً على طلبك
        return;
      } else {
        mapAreaEl.style.display = 'block';
      }

      // نبضات رادار الطلبات الحية في الأماكن التي يطلب منها العملاء
      Object.values(ridesDB).forEach(r => {
        if (['offering', 'no_drivers', 'accepted'].includes(r.status) && r.pickup && r.pickup.lat && r.pickup.lng) {
          if (r.id !== currentOfferId) {
            const el = document.createElement('div');
            el.className = 'radar-pulse-dot';
            el.innerHTML = `<div class="ring"></div><div class="core">🔥 طلب هنا</div>`;
            mapMarkers.push(new mapboxgl.Marker(el).setLngLat([r.pickup.lng, r.pickup.lat]).addTo(map));
          }
        }
      });

      // أماكن الكباتن الآخرين المتصلين (بدون بيانات شخصية)
      Object.values(driversDB).forEach(d => {
        if (d.id !== currentDriverPhone && d.online && !d.isBlocked && d.lat && d.lng) {
          mapMarkers.push(new mapboxgl.Marker({ color: '#475569' }).setLngLat([d.lng, d.lat]).addTo(map));
        }
      });
    }

    function checkIncomingAndActiveRides() {
      if (!currentDriverPhone) return;
      const incBox = document.getElementById('incoming-box');
      const actBar = document.getElementById('active-trip-bar');

      const offered = Object.values(ridesDB).find(r => r.status === 'offering' && r.offeredToDriverId === currentDriverPhone);
      if (offered) {
        if (currentOfferId !== offered.id) { currentOfferId = offered.id; showIncomingOffer(offered); }
      } else {
        currentOfferId = null; clearInterval(countdownInterval); incBox.style.display = 'none';
      }

      const active = Object.values(ridesDB).find(r => r.driverId === currentDriverPhone && ['accepted','arrived','in_progress'].includes(r.status));
      if (active) {
        activeRideId = active.id;
        actBar.style.display = 'block';
        document.getElementById('live-fare-val').innerText = active.liveFare;
        document.getElementById('live-km-val').innerText = (active.liveDistKm || 0).toFixed(2);

        const cliPhone = active.clientPhone || active.clientId;
        document.getElementById('active-cli-name').innerText = active.clientName;
        document.getElementById('active-cli-phone').innerText = cliPhone;
        document.getElementById('btn-call-client').href = `tel:${cliPhone}`;
        document.getElementById('btn-call-client').onclick = () => logRideEvent(active.id, `ضغط الكابتن على زر اتصال بالعميل (${cliPhone})`);
        document.getElementById('btn-wa-client').href = `https://wa.me/${cliPhone.replace(/\D/g,'')}?text=${encodeURIComponent('مرحباً معك كابتن SmartRide')}`;
        document.getElementById('btn-wa-client').onclick = () => logRideEvent(active.id, `ضغط الكابتن على زر مراسلة واتساب للعميل`);

        if (active.status === 'accepted') {
          document.getElementById('trip-state-lbl').innerText = `متجه للعميل`;
          document.getElementById('btn-arrived').style.display = 'inline-flex';
          document.getElementById('btn-start').style.display = 'none';
          document.getElementById('btn-finish').style.display = 'none';
        } else if (active.status === 'arrived') {
          document.getElementById('trip-state-lbl').innerText = `بانتظار العميل`;
          document.getElementById('btn-arrived').style.display = 'none';
          document.getElementById('btn-start').style.display = 'inline-flex';
          document.getElementById('btn-finish').style.display = 'none';
        } else if (active.status === 'in_progress') {
          document.getElementById('trip-state-lbl').innerText = `🚀 الرحلة جارية`;
          document.getElementById('btn-arrived').style.display = 'none';
          document.getElementById('btn-start').style.display = 'none';
          document.getElementById('btn-finish').style.display = 'inline-flex';
        }
      } else {
        activeRideId = null; actBar.style.display = 'none';
      }
    }

    async function showIncomingOffer(ride) {
      document.getElementById('incoming-box').style.display = 'flex';
      document.getElementById('inc-dist').innerText = `${haversineKm(myPos.lat, myPos.lng, ride.pickup.lat, ride.pickup.lng).toFixed(2)} كم`;
      document.getElementById('inc-details').innerText = ride.hasPredefinedDest ? `التكلفة المقدرة: ${ride.estimatedFare} ج.م` : 'بدون وجهة مسبقة (عداد)';
    }

    window.acceptOffer = async function() {
      if (!currentOfferId) return;
      await update(ref(db, `smartride/rides/${currentOfferId}`), {
        status: 'accepted', driverId: currentDriverPhone, driverName: driversDB[currentDriverPhone]?.name || 'كابتن', acceptedAt: Date.now(), offeredToDriverId: null
      });
      logRideEvent(currentOfferId, `قبل الكابتن الرحلة`);
      document.getElementById('incoming-box').style.display = 'none';
    };

    window.rejectOfferExplicitly = async function() {
      if (!currentOfferId) return;
      document.getElementById('incoming-box').style.display = 'none';
    };

    window.markArrived = async function() {
      if (!activeRideId) return;
      await update(ref(db, `smartride/rides/${activeRideId}`), { status: 'arrived', arrivedAt: Date.now() });
      logRideEvent(activeRideId, `وصل الكابتن لمكان العميل`);
    };

    window.startRide = async function() {
      if (!activeRideId) return;
      await update(ref(db, `smartride/rides/${activeRideId}`), { status: 'in_progress', liveDistKm: 0, liveWaitMin: 0 });
      logRideEvent(activeRideId, `بدأت الرحلة فعلياً`);
    };

    window.finishRide = async function() {
      if (!activeRideId) return;
      const r = ridesDB[activeRideId];
      let tripFare = calcFare(r.category, r.liveDistKm || 0, r.liveWaitMin || 0);
      await update(ref(db, `smartride/rides/${activeRideId}`), { status: 'completed', finalFare: tripFare });
      logRideEvent(activeRideId, `انتهت الرحلة بأجرة ${tripFare} ج.م`);
      document.getElementById('drv-invoice-summary').innerHTML = `المبلغ: ${tripFare} ج.م`;
      document.getElementById('rate-client-modal').style.display = 'flex';
    };

    window.pickClientStars = function(stars) { chosenStarsForClient = stars; };
    window.submitClientRating = async function() {
      document.getElementById('rate-client-modal').style.display = 'none';
      activeRideId = null;
    };

    window.toggleOnlineState = async function(checked) {
      if (!currentDriverPhone) return;
      isOnline = checked;
      document.getElementById('ui-online-txt').innerText = checked ? 'أونلاين' : 'أوفلاين';
      await update(ref(db, `smartride/drivers/${currentDriverPhone}`), { online: checked });
    };

    function refreshHeaderUI() {
      if (!currentDriverPhone || !driversDB[currentDriverPhone]) return;
      const d = driversDB[currentDriverPhone];
      const rInfo = getRatingInfo(d);
      const badge = document.getElementById('hdr-drv-badge');
      badge.className = `rating-frame ${rInfo.tierClass}`;
      document.getElementById('ui-drv-name').innerText = d.name;
      document.getElementById('ui-drv-rating').innerText = rInfo.label;
      document.getElementById('hdr-drv-photo').src = d.photoUrl || 'https://cdn-icons-png.flaticon.com/512/3135/3135715.png';
      document.getElementById('ui-drv-bal').innerText = `${d.balance ?? 0} ج`;
      document.getElementById('ui-drv-cat').innerText = d.category || 'ملاكي';
      document.getElementById('ui-drv-model').innerText = `${d.carModel || ''}`;
      document.getElementById('ui-drv-plate').innerText = d.carPlate || '---';

      // حساب عدد الرحلات التي أنجزها الكابتن
      const tripsCnt = Object.values(ridesDB).filter(r => r.driverId === currentDriverPhone && r.status === 'completed').length;
      document.getElementById('ui-drv-trips-count').innerText = tripsCnt;
    }

    window.openDriverMessages = function() { document.getElementById('drv-messages-modal').classList.add('open'); };
    window.closeDriverMessages = function() { document.getElementById('drv-messages-modal').classList.remove('open'); };
    window.backToDriverThreads = function() { document.getElementById('drv-threads-list-view').style.display = 'block'; document.getElementById('drv-thread-detail-view').style.display = 'none'; };
    window.createDriverThread = async function() {};
    window.sendDriverReply = async function() {};
  </script>
</body>
</html>
